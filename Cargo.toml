[package]
name = "marmota"
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "Daily note templating system"
authors = ["b3ella"]
readme = "readme.md"
repository = "https://github.com/b3ella/groundhog"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"

[[bin]]
name = "groundhog"
path = "src/main.rs"
