[package]
name = "marmota"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Daily note templating system"
authors = ["b3ella"]
readme = "readme.md"
repository = "https://github.com/b3ella/marmota"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
regex = "1.13.1"

[[bin]]
name = "marmota"
path = "src/main.rs"

