[package]
name = "marmota"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Daily note templating system"
authors = ["b3ella"]
readme = "readme.md"
repository = "https://github.com/b3ella/marmota"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
regex = "1.13.1"

[[bin]]
name = "marmota"
path = "src/main.rs"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

